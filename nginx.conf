worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # 1. Redirect all HTTP traffic to HTTPS
    server {
        listen       80;
        server_name  localhost *.app.test;
        return 301 https://$host$request_uri;
    }

    # 2. Next.js + BFF (https://nextjs.app.test -> port 3001)
    server {
        listen       443 ssl;
        server_name  nextjs.app.test;

        ssl_certificate      C:/nginx-1.31.10/conf/nextjs.app.test+3.pem;
        ssl_certificate_key  C:/nginx-1.31.10/conf/nextjs.app.test+3-key.pem;

        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
        }
    }

    # 2.1 React app (https://react.app.test -> port 3000)
    server {
        listen       443 ssl;
        server_name  react.app.test;

        ssl_certificate      C:/nginx-1.31.10/conf/nextjs.app.test+3.pem;
        ssl_certificate_key  C:/nginx-1.31.10/conf/nextjs.app.test+3-key.pem;

        # Redirect bare https://react.app.test or /ads to /ads/
        location = / {
            return 301 https://$host/ads/;
        }
        location = /ads {
            return 301 https://$host/ads/;
        }

        # Strip "/ads/" before forwarding to `serve` on port 3000
        location /ads/ {
            proxy_pass http://127.0.0.1:3000/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
        }
    }

    # 3. Auth Server (https://auth.app.test -> port 88)
    server {
        listen       443 ssl;
        server_name  auth.app.test;

        ssl_certificate      C:/nginx-1.31.10/conf/nextjs.app.test+3.pem;
        ssl_certificate_key  C:/nginx-1.31.10/conf/nextjs.app.test+3-key.pem;

        location / {
            proxy_pass http://127.0.0.1:88;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
    }
}
